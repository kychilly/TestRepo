# Validator thresholds
#
# Every number the decision tree touches lives here, not in validator.py.
# If a threshold ever needs to move to make the four-gene gate pass, that
# change (and the reason for it) must be logged in gate_log.jsonl by
# run_gate() -- see validator.py. As of this version, NO threshold was moved
# to pass the gate; all three values below are literature-informed defaults
# chosen before the gate was ever run.

# AlphaFold per-residue pLDDT floor.
# pLDDT is AlphaFold's own confidence in the predicted local structure.
# DeepMind's published confidence bands are: >90 very high, 70-90 confident,
# 50-70 low, <50 very low/disordered. We require >= 70 ("confident" or
# better) before we will trust ANY shape-based (ddG) claim about a residue.
# Below this, the "protein falls apart" story is not testable, not "false".
plddt_floor: 70.0

# ESM1b variant-effect score cutoff.
# ESM1b scores are log-likelihood-ratio style effect sizes; more negative =
# more evolutionarily/functionally unusual = more likely damaging. -7.5 is
# the pathogenic/benign separation point reported in the ESM1b variant-effect
# literature (Brandes et al.) and is used here as the "functional driver"
# cutoff, i.e. the IDH1-style signal that does not require structural
# destabilization.
esm1b_cutoff: -7.5

# ddG stability cutoff, in kcal/mol.
# ddG > 0 means the mutant protein is LESS stable than wild-type. Values
# above roughly 1-2 kcal/mol are conventionally treated as destabilizing in
# the stability-prediction literature (e.g. FireProtDB / FoldX usage). We use
# 1.5 kcal/mol as the midpoint of that convention. Under our own TP53 gate
# data (ddG = 3.01) and IDH1 gate data (ddG = 0.4) this cutoff cleanly
# separates the two known patterns without needing to be tuned to them.
ddg_cutoff: 1.5
