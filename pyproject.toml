[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gbm-ml-research"
version = "0.1.0"
description = "Leakage-resistant infrastructure for a glioblastoma modeling study"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
gbm-study = "gbm_study.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true
# Scientific Python packages commonly omit PEP 561 metadata. Existing ignores
# document those boundaries and should remain valid across environments where
# optional stubs may or may not be installed.
warn_unused_ignores = false
